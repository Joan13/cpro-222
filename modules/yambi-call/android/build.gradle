plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.yambi.call'
version = '1.0.0'

android {
  namespace "com.yambi.call"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.12.0'
  implementation 'androidx.appcompat:appcompat:1.6.1'

  // WebRTC natif Android (fournit org.webrtc.*)
  implementation 'io.getstream:stream-webrtc-android:1.3.8'

  // Socket.IO client Android – signaling vers server.yambi.net/ws
  implementation('io.socket:socket.io-client:2.1.0') {
    // Exclure le json bundlé, Android en fournit un
    exclude group: 'org.json', module: 'json'
  }

  // Coroutines Android
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

  // Glide – chargement des avatars dans ActiveCallActivity
  implementation 'com.github.bumptech.glide:glide:4.16.0'
}
